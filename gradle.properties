# Important Notes:
# Every field you add must be added to the root build.gradle expandProps map.

# Project
version=1.0.0
group=com.corpserun
java_version=21

# Common
minecraft_version=1.21.1
mod_name=CorpseRun
mod_author=Odder
mod_id=corpserun
license=CC0-1.0
credits=
description=Die, become a ghost, and corpse run back to your body. Get within range of your corpse and /resurrect.
minecraft_version_range=[1.21.1]
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.21
parchment_version=2024.11.10

# Fabric
fabric_version=0.109.0+1.21.1
fabric_loader_version=0.16.9
modmenu_version=11.0.3


# Sable Companion: optional Sable / Create Aeronautics support (sub-levels). Bundled; a no-op without Sable.
# https://github.com/ryanhcode/sable-companion
sable_companion_version=1.6.0
# Dev runs only (NeoForge): Sable, Create and Create Aeronautics, from Modrinth.
# false leaves them out of dev runs, to test without Sable. Also: ./gradlew ... -Pdev_aeronautics=false
dev_aeronautics=true
sable_mod_version=1.2.2
create_mod_version=6.0.10
create_aeronautics_version=1.2.1

# NeoForge
# Used to build and for dev runs. 21.1.219+ because Create / Sable in the dev runs need it.
neoforge_version=21.1.233
# The NeoForge versions the mod supports (neoforge.mods.toml): 21.1.80 (also Sable Companion's minimum) up to,
# but not including, 21.2 (Minecraft 1.21.2+).
neoforge_min_version=21.1.80
neoforge_max_version=21.2
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
