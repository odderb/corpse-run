plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}
repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'TerraformersMC'
                url = 'https://maven.terraformersmc.com/releases/'
            }
        }
        filter { includeGroup('com.terraformersmc') }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // Optional: only used for the config screen button. Also in dev runs, to test it.
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    modLocalRuntime "com.terraformersmc:modmenu:${modmenu_version}"
    // Sable sub-levels (Create Aeronautics). Bundled; does nothing without Sable. The fabric jar is already in
    // intermediary names but was built with a newer Loom than this one can remap, so it is bundled untouched and
    // the Mojang-named common jar is used to compile and for dev runs.
    include "dev.ryanhcode.sable-companion:sable-companion-fabric-${minecraft_version}:${sable_companion_version}"
    compileOnly "dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}"
    localRuntime "dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        // Local multiplayer test, see gradle/multiplayer.gradle.
        mpServer {
            server()
            setConfigName('Fabric MP Server')
            runDir('runs/mp-server')
        }
        mpClient1 {
            client()
            setConfigName('Fabric MP Client 1')
            runDir('runs/mp-client1')
            programArgs('--username', 'Player1', '--quickPlayMultiplayer', '127.0.0.1:25565')
        }
        mpClient2 {
            client()
            setConfigName('Fabric MP Client 2')
            runDir('runs/mp-client2')
            programArgs('--username', 'Player2', '--quickPlayMultiplayer', '127.0.0.1:25565')
        }
    }
}

ext.multiplayerServerRun = 'runMpServer'
ext.multiplayerClientRuns = ['runMpClient1', 'runMpClient2']
// The clients' --username values; all of them are made operators on the test server.
ext.multiplayerPlayers = ['Player1', 'Player2']
apply from: rootProject.file('gradle/multiplayer.gradle')
