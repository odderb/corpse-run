plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            data()

            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()

        }
        server {
            server()
        }
        // Local multiplayer test, see gradle/multiplayer.gradle.
        mpServer {
            server()
            gameDirectory = project.file('runs/mp-server')
            programArgument('--nogui')
        }
        mpClient1 {
            client()
            gameDirectory = project.file('runs/mp-client1')
            programArguments.addAll('--username', 'Player1', '--quickPlayMultiplayer', '127.0.0.1:25565')
        }
        mpClient2 {
            client()
            gameDirectory = project.file('runs/mp-client2')
            programArguments.addAll('--username', 'Player2', '--quickPlayMultiplayer', '127.0.0.1:25565')
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup('maven.modrinth') }
    }
    maven {
        name = 'CreateMod'
        url = 'https://maven.createmod.net'
    }
}

// Mods only present in dev runs (runClient, runServer, runMultiplayer), not dependencies of the published mod.
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Sable sub-levels (Create Aeronautics). Jar-in-jar; Sable ships its own copy and the newest one wins.
    jarJar(implementation("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:[${sable_companion_version},)")) {
        version { prefer(sable_companion_version) }
    }

    // Create Aeronautics (on Sable) in dev runs, to test corpses on airships. dev_aeronautics=false leaves them out,
    // to test without Sable.
    if (dev_aeronautics.toBoolean()) {
        localRuntime "maven.modrinth:sable:${sable_mod_version}+mc${minecraft_version}"
        localRuntime "maven.modrinth:create:${create_mod_version}+mc${minecraft_version}"
        localRuntime "maven.modrinth:create-aeronautics:${create_aeronautics_version}+mc${minecraft_version}"
    }
}

ext.multiplayerServerRun = 'runMpServer'
ext.multiplayerClientRuns = ['runMpClient1', 'runMpClient2']
// The clients' --username values; all of them are made operators on the test server.
ext.multiplayerPlayers = ['Player1', 'Player2']
apply from: rootProject.file('gradle/multiplayer.gradle')
